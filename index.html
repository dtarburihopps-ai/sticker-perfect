<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>Sticker Perfect</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Меню: раскрытый альбом. Слева «Играть», справа наклейки-уровни.
       Пока страницы альбома нарисованы стилями; когда придёт картинка
       от Себастиана, она встанет фоном на #album -->
  <div id="menu" hidden>
    <div id="album">

      <div class="page left">
        <img id="logo" src="web/logo.webp" alt="Sticker Perfect">
        <img id="mascot-menu" src="web/mascot-menu.webp" alt="">
        <button id="play">Играть</button>
      </div>

      <div class="page right">
        <h2>Уровни</h2>
        <div id="level-grid"></div>

        <div id="menu-pages">
          <button id="menu-prev" aria-label="Предыдущая страница" hidden>
            <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <path d="M15 5 L8 12 L15 19"></path>
            </svg>
          </button>
          <button id="menu-next" aria-label="Следующая страница" hidden>
            <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <path d="M9 5 L16 12 L9 19"></path>
            </svg>
          </button>
        </div>
      </div>

    </div>
  </div>

  <div id="app">

    <div id="scene">
      <img id="background" alt="">

      <!-- Обстановка уровня: вещи, которые лежат в холодильнике с самого
           начала и не двигаются. Стикеры кладутся поверх них -->
      <div id="decor"></div>

      <!-- Стрелка «назад в меню». Уйти можно в любой момент; собранное
           на уровне при этом не сохраняется — вернёшься к чистой сцене -->
      <button id="back-to-menu" aria-label="В меню">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M19 12 H6 M11 7 L6 12 L11 17"></path>
        </svg>
      </button>

      <button id="vibration-toggle" aria-label="Выключить вибрацию">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
          <rect x="8" y="3" width="8" height="18" rx="2"></rect>
          <path d="M4 9v6M2 11v2M20 9v6M22 11v2"></path>
        </svg>
      </button>
    </div>

    <div id="tray">
      <!-- Стрелки листания. Показываются только когда есть куда листать -->
      <button id="tray-prev" class="tray-arrow" aria-label="Предыдущие стикеры" hidden>
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M15 5 L8 12 L15 19"></path>
        </svg>
      </button>

      <button id="tray-next" class="tray-arrow" aria-label="Следующие стикеры" hidden>
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M9 5 L16 12 L9 19"></path>
        </svg>
      </button>
    </div>

    <!-- Слой со стикерами: лежит поверх всего, чтобы стикер мог лететь
         из полосы на сцену, не перепрыгивая между контейнерами -->
    <div id="stickers"></div>

    <!-- Куски фона, которые должны быть НАД стикерами: передняя стенка
         ящиков. Благодаря ей продукт выглядит лежащим внутри ящика -->
    <div id="overlays"></div>

    <!-- Кот выглядывает снизу, когда уровень собран. Это и есть финал -->
    <img id="mascot" src="web/cat.webp" alt="">

    <!-- Конец уровня: в меню и дальше. Панель стоит ровно в середине
         экрана и ни к чему не привязана: кот со временем будет меняться
         и вылезать с разных сторон, а кнопки от этого не поедут.
         Стрелка справа — по ходу движения вперёд -->
    <div id="finish" hidden>
      <button id="to-menu" aria-label="В меню">
        <svg viewBox="0 0 24 24" width="34" height="34" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
          <path d="M4 5.5a2 2 0 0 1 2-2h5v17H6a2 2 0 0 1-2-2z"></path>
          <path d="M20 5.5a2 2 0 0 0-2-2h-5v17h5a2 2 0 0 0 2-2z"></path>
        </svg>
      </button>

      <button id="next-level" aria-label="Следующий уровень">
        <svg viewBox="0 0 24 24" width="54" height="54" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
          <path d="M5 12 H18 M13 7 L18 12 L13 17"></path>
        </svg>
      </button>
    </div>

  </div>

  <!-- Порядок файлов — от общего к частному, и он же порядок
       зависимостей: каждый следующий опирается на предыдущие -->
  <script src="log.js"></script>
  <script src="levels.js"></script>
  <!-- Заглушки на время загрузки: та же картинка шириной 16 пикселей.
       Делается tools/optimize.py -->
  <script src="blur.js"></script>
  <script src="progress.js"></script>
  <script src="sound.js"></script>
  <script src="assets.js"></script>
  <script src="geometry.js"></script>
  <script src="rules.js"></script>
  <script src="game.js"></script>
  <!-- Меню идёт последним: оно и решает, что показать при запуске —
       альбом или уровень -->
  <script src="menu.js"></script>
</body>
</html>

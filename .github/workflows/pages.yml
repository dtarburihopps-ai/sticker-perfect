name: Публикация игры на GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Наружу отдаём только саму игру. Папку рефов, инструменты и брифы
      # публиковать незачем: это рабочие материалы, а не часть игры,
      # и рефы весят 24 МБ. Картинки берём из web/ — это готовые
      # лёгкие копии, а тяжёлые оригиналы из images/ наружу не нужны.

      # Сверяем данные уровней до сборки: ошибка в них не ломает код,
      # она ждёт, пока игрок ткнёт пальцем. Пусть лучше упадёт публикация.
      - name: Сверить данные уровней
        run: node tools/check.js

      # Скрипты копируем звёздочкой, а не списком имён: список пришлось бы
      # пополнять руками при каждом новом файле, а забытый файл дал бы
      # зелёную публикацию и сломанную игру на сайте.
      - name: Собрать папку для публикации
        run: |
          mkdir _site
          cp index.html style.css *.js _site/
          cp -r web _site/

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
